# Static edge for the Vite build. The product server is backend:8080.
map $request_uri $forge_static_cache {
    default "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/browser-engine/objects/ "public, max-age=31536000, immutable";
}

map $http_x_forwarded_proto $forge_external_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    add_header Cache-Control $forge_static_cache always;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forge_external_proto;
        add_header Cache-Control "no-store" always;
    }
    location = /gre {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    include /usr/share/nginx/html/seo-routes.conf;
}
