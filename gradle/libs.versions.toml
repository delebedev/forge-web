# Forge Web build versions. Leyline keeps its own catalog for the engine modules.
[versions]
kotlin = "2.4.0"
serialization = "1.11.0"
netty = "4.2.17.Final"
ktor = "3.5.1"
logback = "1.6.5"
sentry = "8.21.1"
exposed = "1.3.1"
sqlite = "3.53.2.0"
flyway = "13.5.0"
ktlint-gradle = "12.1.2"

[libraries]
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-sqlite = { module = "org.flywaydb:flyway-database-nc-sqlite", version.ref = "flyway" }
netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
sentry-logback = { module = "io.sentry:sentry-logback", version.ref = "sentry" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-routing-openapi = { module = "io.ktor:ktor-server-routing-openapi", version.ref = "ktor" }
ktor-server-forwarded-header = { module = "io.ktor:ktor-server-forwarded-header", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
