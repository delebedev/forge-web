name: Claude review

# Runs Claude Code's bundled `/code-review` once when a maintainer adds the
# `claude-review` label to a same-repository, non-draft pull request. Findings
# land as inline comments; a script step then posts one verdict comment that
# names the reviewed head. Re-add the label to review a newer head.
on:
  pull_request:
    types: [labeled]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.label.name == 'claude-review' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - id: start
        name: Record the review start and repository guidance
        run: |
          echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          cat > "$RUNNER_TEMP/review-guidance.md" <<'EOF'
          Repository guidance for this pull request review:
          - The root REVIEW.md defines what blocks a merge and what not to report. Read it before judging findings.
          - Read the pull request description with `gh pr view` and check its claims against the diff.
          - Report only problems this change introduces or makes worse; post no pre-existing findings.
          - Pass `confirmed: true` to the inline comment tool, and start each comment with its severity: `Important:` or `Nit:`.
          EOF

      - id: review
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The job token posts the review, so no GitHub App or OIDC exchange is needed.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # `high` runs several finder agents and a verify pass through the Agent
          # tool; without that tool the review falls back to a single pass.
          prompt: /code-review high --comment ${{ github.event.pull_request.number }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 80
            --permission-mode dontAsk
            --allowedTools "Agent,Read,Glob,Grep,Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt-file ${{ runner.temp }}/review-guidance.md

      - name: Post the verdict
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SINCE: ${{ steps.start.outputs.at }}
          EXECUTION_FILE: ${{ runner.temp }}/claude-execution-output.json
        run: |
          # The review's closing result message, or null when the run never finished.
          result=null
          if [ -f "$EXECUTION_FILE" ]; then
            result=$(jq -c 'map(select(.type == "result")) | last // null' "$EXECUTION_FILE")
          fi

          # Inline comments posted since this run started. The review starts each
          # one with its severity. A push during the review moves comments to the
          # new head, so the reviewed head is not used as a filter.
          gh api --paginate "repos/$REPO/pulls/$PR/comments" --jq '.[]' |
            jq -s --arg since "$SINCE" 'map(select(.user.login == "github-actions[bot]" and .created_at >= $since))' \
            > findings.json
          important=$(jq -r '.[] | select(.body | test("^\\W*Important"; "i"))
            | "- `\(.path):\(.line // .original_line)` \(.body | sub("^\\W*Important\\W*"; ""; "i") | split("\n")[0] | .[0:160])"' findings.json)
          # A finding the review could not anchor to a changed line stays in its result text.
          if jq -e '.result // "" | test("🔴")' <<<"$result" >/dev/null && [ -z "$important" ]; then
            important="- Important findings did not post inline; see this run's summary."
          fi

          {
            if [ "$(jq -r '.subtype // "missing"' <<<"$result")" != success ]; then
              echo "Verdict: INCOMPLETE"
              echo "Reviewed head: $HEAD_SHA"
              echo "- The review did not finish; re-add the label to run it again."
            elif [ -n "$important" ]; then
              echo "Verdict: CHANGES"
              echo "Reviewed head: $HEAD_SHA"
              echo "$important"
            else
              echo "Verdict: APPROVE"
              echo "Reviewed head: $HEAD_SHA"
            fi
          } > verdict.md
          gh pr comment "$PR" --repo "$REPO" --body-file verdict.md

          stats="$(jq length findings.json) inline findings"
          if [ -f "$EXECUTION_FILE" ]; then
            stats="$stats; $(jq -r '[.[] | select(.type == "assistant") | .message.content[]? | select(.type == "tool_use") | .name]
              | group_by(.) | map("\(.[0]) \(length)") | "tool calls: " + join(", ")' "$EXECUTION_FILE")"
          fi
          stats="$stats; $(jq -r 'if . == null then "no result" else "turns \(.num_turns), cost \(.total_cost_usd), refused \(.permission_denials | map(.tool_name) | join(" ") | if . == "" then "none" else . end)" end' <<<"$result")"
          echo "$stats"
          {
            echo "## Claude review"
            cat verdict.md
            echo
            echo "$stats"
            echo
            jq -r '.result // ""' <<<"$result"
          } >> "$GITHUB_STEP_SUMMARY"
