name: Claude review

# Runs Claude Code's bundled `/code-review` once when a maintainer adds the
# `claude-review` label to a same-repository, non-draft pull request. Findings
# land as inline comments, followed by one verdict comment that names the
# reviewed head. Re-add the label to review a newer head.
on:
  pull_request:
    types: [labeled]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.label.name == 'claude-review' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The job token posts the review, so no GitHub App or OIDC exchange is needed.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # `high` widens coverage beyond the most confident findings. The bundled
          # review reads the diff with `gh pr diff` and posts each finding through
          # the inline comment tool.
          prompt: /code-review high --comment ${{ github.event.pull_request.number }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 80
            --permission-mode dontAsk
            --allowedTools "Read,Glob,Grep,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "The repository's root REVIEW.md defines what blocks a merge here; read it before judging findings. After the review has posted its inline comments, post exactly one top-level comment with `gh pr comment ${{ github.event.pull_request.number }} --body \"...\"`. Line 1: `Verdict: CHANGES` when any finding is Important, otherwise `Verdict: APPROVE`. Line 2: `Reviewed head: ${{ github.event.pull_request.head.sha }}`. Then one line per Important finding, as file:line and a short summary."
