name: Chromatic

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - '.storybook/**'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - 'scripts/build/seo.ts'
      - 'chromatic.config.json'
      - '.github/workflows/chromatic.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - '.storybook/**'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - 'scripts/build/seo.ts'
      - 'chromatic.config.json'
      - '.github/workflows/chromatic.yml'
  workflow_dispatch:

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual:
    # Pull requests from forks have no access to the project token.
    if: >-
      vars.CHROMATIC_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    name: Visual review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      # Chromatic compares the PR head commit, not the merge commit GitHub builds by default.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify project token
        run: test -n "$CHROMATIC_PROJECT_TOKEN"
      - name: Build Storybook
        run: bun run build-storybook
      - name: Publish visual checks
        run: bun run chromatic --storybook-build-dir storybook-static --ci
