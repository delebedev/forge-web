name: Chromatic

on:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'src/**'
      - 'public/**'
      - '.storybook/**'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - 'scripts/seo.ts'
      - 'chromatic.config.json'
      - '.github/workflows/chromatic.yml'
  workflow_dispatch:

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual:
    if: vars.CHROMATIC_ENABLED == 'true'
    name: Visual review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify project token
        run: test -n "$CHROMATIC_PROJECT_TOKEN"
      - name: Build Storybook
        run: bun run build-storybook
      - name: Publish visual checks
        run: bun run chromatic --storybook-build-dir storybook-static --ci
